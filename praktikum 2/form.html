<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <form action="">
        <table>
            <tr>
                <td><label for="name">Nama :</label></td>
                <td><input type="text" id="name" placeholder="Nama"></td>
            </tr>
            <tr>
                <td><label for="email">Email :</label></td>
                <td><input type="email" id="email" placeholder="Email"></td>
            </tr>
            <tr>
                <td><label for="JK">Jenis Kelamin :</label></td>
                <td><input type="radio" name="JK" id="Laki-laki"><label for="Laki-laki">Laki-laki</label></td>
                <td><input type="radio" name="JK" id="Perempuan"><label for="Perempuan">Perempuan</label></td>
            </tr>
            <tr>
                <td><label for="Negara">Negara :</label></td>
                <td><select name="Negara" id="Negara">
                    <option value="">Indonesia</option>
                    <option value="">Vietnam</option>
                    <option value="">Singapore</option>
                    <option value="">India</option>
                </select></td>
            </tr>

            <tr> 
                <td><label for="password">Password :</label></td>
                <td><input type="password" id="password" placeholder="Password"></td>
            </tr>
            <tr>
                <td><label for="alamat">Alamat :</label></td>
                <td><textarea name="" id="alamat" placeholder="Masukan alamat anda"></textarea></td>
            </tr>

            <tr>
                <td><button>Register</button></td>
            </tr>
        </table>
</body>
</html>
