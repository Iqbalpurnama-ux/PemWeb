<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Form Registrasi</title>
</head>
<body>

    <h2>Form HTML</h2>

    <form>
        <p><label>Name: <input type="text" name="name"></label></p>

        <p>
            Gender:
            <label><input type="radio" name="gender" value="Man"> Man</label>
            <label><input type="radio" name="gender" value="Woman"> Woman</label>
        </p>

        <p><label>Address: <input type="text" name="address"></label></p>

        <p>
            <label>Country:
                <select name="country">
                    <option value="Indonesia">Indonesia</option>
                    <option value="Malaysia">Malaysia</option>
                    <option value="Singapore">Singapore</option>
                </select>
            </label>
        </p>

        <p><label>Email: <input type="email" name="email"></label></p>

        <p><label>Photo: <input type="file" name="photo"></label></p>

        <p>
            <label>Comment:</label>
            <textarea name="comment" rows="6" cols="35"></textarea>
            <input type="submit" value="Submit">
        </p>

        <p align="center"><b>Form Registrasi</b></p>
    </form>

</body>
</html>
